name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Windows structural and safety regression tests
        shell: pwsh
        run: ./tests/CleanBatch.Tests.ps1

  macos:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run macOS structural and safety regression tests
        shell: bash
        run: bash ./tests/CleanBatchMac.Tests.sh
